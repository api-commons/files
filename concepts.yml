context: files
name: Files and Documents
intro: >-
  The common file vocabulary -- files and the folders they sit in, the buckets that hold
  objects, the versions a file keeps and the permissions that share it -- distilled from
  the APIs that already exist.
tags: [Cloud Storage, Object Storage, Document Management, Documents, File Storage, File Sharing, File Management]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, entries]

common_fields:
  id: [uuid, guid, object_id, record_id, file_id, key]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, created_time, uploaded_at, upload_date]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified, modified_time, last_modified_date_time, server_modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties, tags, labels]
  name: [title, display_name, label, filename, file_name, original_name, original_filename]
  description: [notes, note, details]
  owner_id: [owner, owned_by, created_by, creator, author, uploaded_by, user_id]
  parent_id: [parent, parent_folder_id, folder_id, parent_reference, directory_id, parents, folder]

concepts:
  file:
    segments: [files, file, documents, document, objects, uploads, assets!themes, "items@drives|drive|folders", blobs]
    aliases:
      size: [file_size, bytes, content_length, size_bytes, filesize, length]
      mime_type: [content_type, mimetype, media_type, file_type, type, format, extension]
      url: [download_url, link, web_url, public_url, file_url, web_view_link, uri, location, href]
      checksum: [md5, sha1, sha256, hash, etag, content_hash, md5_checksum]
      path: [path_display, path_lower, full_path, file_path]
      version: [version_id, revision, rev, latest_version]
  folder:
    requires: [file]
    segments: [folders, folder, directories, directory, dirs]
    aliases:
      path: [path_display, full_path, folder_path]
      item_count: [file_count, items_count, children_count]
  bucket:
    requires: [file]
    segments: [buckets, bucket, containers@storage|blob|storage-accounts]
    aliases:
      region: [location, location_constraint, datacenter, region_name]
      is_public: [public, acl, visibility, access]
      versioning: [versioning_enabled, versioning_status]
  file_version:
    requires: [file]
    path: /files/{file_id}/versions
    segments: [versions@files|file|documents|document|objects, revisions@files|file|documents|document]
    aliases:
      size: [file_size, bytes, content_length]
      version_number: [version, revision, rev, number]
      is_latest: [latest, current, is_current]
  permission:
    requires: [file]
    segments: [permissions, permission, shares, share, shared_links, shared-links, sharedlinks, collaborations, sharing, access]
    aliases:
      role: [access_level, permission_level, level, access, role_id, permission]
      grantee: [email, user_id, user, email_address, invitee, recipient, shared_with, accessible_by, group_id]
      url: [link, shared_link, share_url, web_url]
      expires_at: [expiration, expiry, expires, expiration_date, expiration_time]

exclude:
  file:
    boldsign: e-signature documents (the e-signature context)
    documenso: e-signature documents
    docuseal: e-signature documents
    getaccept: e-signature documents
    pandadoc: e-signature and proposal documents
    gonitro: e-signature documents
    inkit: generated-document renders
    google-cloud-firestore: database documents
    google-docs: editor documents (structured text), not files
    google-suite-docs-sheets-slides-gmail: editor documents
    machinelibrary-ai: parsed-document records
    canto: /products/{id}/assets links assets to a product
  folder:
    lev: /lenders/directory is a lender directory
    microsoft-graph: /directory is the identity directory
    nuxeo: /directory is a user/vocabulary directory
  permission:
    adobe-suite: analytics component shares
    boldsign: template sharing in an e-signature product
    synadia-communications: message-stream export shares
    tiledb: array-database sharing invitations
duplicates:
  gonitro: [nitro-software]
  microsoft-powerpoint: [powerpoint]

findings:
  - "Once signature documents, database documents and editor documents are set aside, a
    file agrees on id, name, MIME type, size and created_at -- the shape of a file
    everywhere. A download URL stays extended: some providers return bytes, some a link."
  - "Folders agree on their parent (parent_id is core), so a folder tree maps across
    providers even where files do not."
  - "Buckets and file versions are thin (4 providers each): most object stores speak the S3
    protocol and publish no OpenAPI of their own for it."
decisions:
  - "The bare Storage tag is not used (energy storage and databases share it); Cloud and
    Object Storage, Document Management, Documents, File Storage and File Sharing are."
  - "A document awaiting signature belongs to e-signature: BoldSign, Documenso, DocuSeal,
    GetAccept, PandaDoc and Nitro are excluded here by name and counted there."
  - "Database documents (Firestore) and editor documents (Google Docs) are not files."
  - "OneDrive-style `/drives/{id}/items` and `/folders/{id}/items` count as files; a bare
    `/items` does not."
  - "A shared link, a collaboration and a share are one concept, `permission`."
