    parameters:
    - $ref: '#/components/parameters/file_id'
    get:
      operationId: getFile
      summary: Get a file
      tags:
      - Files
      x-commons-tier: core
      x-commons-share: 0.824
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/File'
    delete:
